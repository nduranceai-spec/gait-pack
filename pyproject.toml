[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "gait-perfect"
version = "0.1.0"
description = "Gait analysis backend — browser-based pose capture and metric extraction"
requires-python = ">=3.11"
dependencies = [
    "mediapipe==0.10.35",
    "opencv-contrib-python==4.11.0.86",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ---------------------------------------------------------------------------
# Vercel Python serverless entrypoint
# Vercel looks for a WSGI/ASGI callable or a BaseHTTPRequestHandler subclass.
# The Handler class in src/web_server.py is a BaseHTTPRequestHandler that
# Vercel's Python runtime can serve directly as a serverless function.
# ---------------------------------------------------------------------------
[tool.vercel]
entrypoint = "src/web_server:Handler"
